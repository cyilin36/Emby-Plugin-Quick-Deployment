name: Installer regression tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.powershell }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            powershell: pwsh
          - os: windows-latest
            powershell: pwsh
          - os: windows-latest
            powershell: powershell
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        if: runner.os == 'Linux'
        run: |
          sh -n install_plugins.sh
          sh -n install_plugins_en.sh
      - name: PowerShell syntax
        shell: ${{ matrix.powershell }}
        run: |
          foreach ($file in @('install_plugins.ps1', 'install_plugins_en.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $file), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { $parseErrors | Write-Error; exit 1 }
          }
      - name: Regression tests
        env:
          PWSH: ${{ matrix.powershell }}
        run: python -m unittest discover -s tests -v
